<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: #ffffff; color: #101828; overflow: hidden;
  }
  .poster {
    position: relative;
    width: 1080px; height: 1080px;
    padding: 52px 60px 44px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(1100px 520px at 92% -8%, rgba(249,115,22,.10), transparent 62%),
      radial-gradient(900px 500px at -10% 108%, rgba(18,44,71,.07), transparent 60%),
      #ffffff;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 47px; height: 47px; }
  .brand .name { font-size: 37px; font-weight: 800; letter-spacing: -.5px; }
  .brand .name span { color: #c2410c; }
  .brand .kicker { margin-top: 2px; font-size: 12.5px; letter-spacing: 1.7px; color: #667085; text-transform: uppercase; }

  h1 { margin-top: 30px; font-size: 80px; line-height: 1.1; letter-spacing: -1.8px; font-weight: 800; }
  h1 em { font-style: normal; color: #c2410c; }
  .sub { margin-top: 14px; font-size: 25px; line-height: 1.5; color: #414c5e; }
  .sub b { color: #101828; }

  .strip {
    margin-top: 24px;
    border: 1px solid #e4e8ee; border-radius: 16px;
    background: #f7f9fc; overflow: hidden;
    box-shadow: 0 14px 34px rgba(16,24,40,.10);
    flex: none;
  }
  .strip img { width: 100%; display: block; }

  .foot { margin-top: 26px; display: flex; gap: 26px; align-items: center; flex: 1 1 auto; min-height: 0; }
  .qr-box { width: 186px; height: 186px; padding: 11px; background: #fff; border: 1px solid #e4e8ee; border-radius: 15px; flex: none; }
  .qr-box img { width: 100%; height: 100%; display: block; }
  .cta { flex: 1 1 auto; }
  .cta .line1 { font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
  .cta .line1 span { color: #c2410c; }
  .cta .line2 { margin-top: 12px; font-size: 21px; color: #475467; line-height: 1.55; }
  .cta .url { margin-top: 12px; font-size: 17px; color: #667085; font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<div class="poster">

  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 4.6 8.1 7.7v7.2c0 4.8 3.2 8.9 7.9 10.4 4.7-1.5 7.9-5.6 7.9-10.4V7.7L16 4.6Z"
            fill="none" stroke="#122c47" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M11.3 14.4 14.3 17.6 20.9 9.7" fill="none" stroke="#c2410c" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.1 27.4h11.8" fill="none" stroke="#c2410c" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="name">ClaimPilot <span>PRO</span></div>
      <div class="kicker">Accounts payable · invoice agent</div>
    </div>
  </div>

  <h1>它读完发票，<br><em>把每个字指给你看。</em></h1>
  <p class="sub">读不到的时候，它说读不到——<b>而不是猜一个填上去。</b></p>

  <div class="strip">
    <img src="invoice-crop.png" alt="一张扫描发票的字段区，每个抽出的字段旁边都标着绿色的回验结果和它在原文中的位置">
  </div>

  <div class="foot">
    <div class="qr-box"><img src="qr.png" alt="扫码打开 ClaimPilot PRO"></div>
    <div class="cta">
      <div class="line1">扫码试用 <span>60 秒</span></div>
      <div class="line2">不用装环境，不用 API key · 演示账号就在页面里</div>
      <div class="url">szlqjc1.github.io/claimpilot-pro</div>
    </div>
  </div>

</div>
</body>
</html>
